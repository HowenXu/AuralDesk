name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Decode release keystore from secrets
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_PASS" "$KS_ALIAS" "$KEY_PASS" > android/keystore.properties
      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auraldesk-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
